name: Publish to GitHub Pages

# The live site is served from the gh-pages branch. Every push to main
# (the daily and hourly updates) is copied there, which republishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy main to gh-pages
        run: git push --force origin HEAD:gh-pages
      - name: Ask GitHub Pages to rebuild
        # Pushes made with the workflow token do not always start a Pages build, so request one.
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
