name: Exchange reach test
# Check which exchanges' free APIs GitHub can reach (for trading unlocks off Binance).
on:
  push:
    branches: [main]
    paths: ["research/venue_probe.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trade-log
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/venue_probe.py
      - run: |
          git config user.name "crypto-desk-bot"; git config user.email "crypto-desk-bot@users.noreply.github.com"
          git add data/venue_probe.json; git commit -m "Exchange reach test" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
