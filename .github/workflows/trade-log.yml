name: Live trade log

# Freezes each unlock short on its check day, records the entry price, then follows the stop,
# target and day +7 cover on completed daily candles. Twice a day. Free.
on:
  schedule:
    - cron: "25 1,13 * * *"
  push:
    branches: [main]
    paths: ["scripts/trade_log.py", "scripts/setup_context.py", "scripts/picks.py", "data/strategy_v3.json"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: trade-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse downloaded exchange candles
        uses: actions/cache@v4
        with:
          path: data/cache/bn
          key: bn-log-${{ github.run_id }}
          restore-keys: |
            bn-log-
            bn-
      - name: Update the trade log
        run: python3 scripts/trade_log.py
      - name: Make the v3 picks (frozen rules, data/strategy_v3.json)
        run: python3 scripts/picks.py
      - name: Refresh price checks and setup context
        run: python3 scripts/signals.py --live
      - name: Save and publish
        run: |
          git config user.name "crypto-desk-bot"
          git config user.email "crypto-desk-bot@users.noreply.github.com"
          git add data/trade_log.json data/signals_live.json data/picks.json data/picks_log.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Trade log update $(date -u +%Y-%m-%d\ %H:%M)"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          if [ "$pushed" != "1" ]; then echo "::error::could not push the results"; exit 1; fi
          git push --force origin HEAD:gh-pages
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
