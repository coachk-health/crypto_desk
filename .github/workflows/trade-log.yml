name: Live trade log

# Freezes each unlock short on its check day, records the entry price, then follows the stop,
# target and day +7 cover on completed daily candles. Twice a day. Free.
on:
  schedule:
    - cron: "25 1,13 * * *"
  push:
    branches: [main]
    paths: ["scripts/trade_log.py"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: trade-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse downloaded exchange candles
        uses: actions/cache@v4
        with:
          path: data/cache/bn
          key: bn-log-${{ github.run_id }}
          restore-keys: |
            bn-log-
            bn-
      - name: Update the trade log
        run: python3 scripts/trade_log.py
      - name: Save and publish
        run: |
          git config user.name "crypto-desk-bot"
          git config user.email "crypto-desk-bot@users.noreply.github.com"
          git add data/trade_log.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Trade log update $(date -u +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          git push --force origin HEAD:gh-pages
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
