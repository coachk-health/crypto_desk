name: Past unlock track record

# Measures what prices did around every past unlock and grades each one with the
# live page's rules. Runs daily and whenever the researched list changes. Free.
on:
  push:
    branches: [main]
    paths: ["data/past_unlocks.json", "scripts/backtest.py", "scripts/score.py", "scripts/signals.py", "scripts/candles.py"]
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse downloaded exchange candles
        # Binance's daily files never change once published, so keep them between runs.
        uses: actions/cache@v4
        with:
          path: data/cache/bn
          key: bn-${{ github.run_id }}
          restore-keys: bn-
      - name: Measure past unlocks
        run: python3 scripts/backtest.py
      - name: Replay the trade-signal playbook
        run: python3 scripts/signals.py
      - name: Save results and publish
        run: |
          git config user.name "crypto-desk-bot"
          git config user.email "crypto-desk-bot@users.noreply.github.com"
          git add data/backtest.json data/backtest-log.txt data/past_unlocks.json data/signals.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Track record update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          # Pushes made by this workflow do not trigger the publish workflow, so copy to gh-pages here.
          git push --force origin HEAD:gh-pages
      - name: Keep the price downloads for checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-cache
          path: |
            data/cache/*.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Ask GitHub Pages to rebuild
        # Pushes made with the workflow token do not always start a Pages build, so request one.
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
      - name: Save the log even if measuring failed
        if: failure()
        run: |
          git config user.name "crypto-desk-bot"
          git config user.email "crypto-desk-bot@users.noreply.github.com"
          git add -f data/backtest-log.txt 2>/dev/null || true
          git commit -m "Track record run failed $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main || true
