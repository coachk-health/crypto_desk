<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach K Crypto Desk</title>
<meta name="description" content="Today's crypto news, upcoming token unlocks and the week's market calendar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/desk.css">
<style>
body { margin: 0; background: var(--night); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
a { color: var(--sun); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 4px; }

header.top { background: radial-gradient(900px 340px at 100% 0%, rgba(240, 138, 36, .18), transparent 70%); padding-top: env(safe-area-inset-top, 0); }
header.top .wrap { padding-bottom: 0; }
.brandrow { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding: 32px 0 18px; }
.brand h1 { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 7vw, 64px); line-height: .9; margin: 0; letter-spacing: .005em; }
.brand p { margin: 8px 0 0; color: var(--muted); }
.prices { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
.prices div { display: flex; gap: 8px; align-items: baseline; }
.prices .s { color: var(--muted); font-weight: 600; font-size: 14px; }
.prices .p { font-family: var(--display); font-weight: 800; font-size: 26px; }
.prices .ch { font-size: 14px; font-weight: 700; }
.prices .src { width: 100%; font-size: 12.5px; color: var(--muted); }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--line); scrollbar-width: none; }
nav.tabs button { font: inherit; font-weight: 600; font-size: 16px; color: var(--muted); background: none; border: 0; padding: 12px 14px; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--sun); }

section { padding-top: 28px; }
.lead { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 38px); line-height: 1.08; margin: 0 0 8px; max-width: 30ch; text-wrap: balance; }
.stamp { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
h2 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 36px 0 12px; }

.stories { display: grid; gap: 14px; }
.storyc { background: var(--panel); border-radius: 14px; padding: 20px 22px; }
.storyc h3 { font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1.08; margin: 8px 0 10px; text-wrap: balance; }
.storyc p { margin: 0; max-width: 68ch; }
.storyc details { margin-top: 12px; }
.storyc summary { cursor: pointer; color: var(--sun); font-weight: 600; font-size: 15px; }
.storyc ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; max-width: 68ch; color: var(--muted); }
.storyc .srcs { margin-top: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.mood { font-size: 14px; }

.briefs { display: grid; gap: 0; }
.briefs a { display: block; text-decoration: none; color: inherit; padding: 14px 0; border-bottom: 1px solid var(--line); }
.briefs a:hover b { color: var(--sun); }
.briefs b { font-weight: 600; font-size: 17px; }
.briefs span { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; max-width: 72ch; }

.seg { display: inline-flex; background: var(--panel); border-radius: 10px; padding: 4px; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); background: none; border: 0; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
.intro { color: var(--muted); max-width: 70ch; margin: 0 0 16px; }

.ul { display: grid; gap: 8px; }
.u { background: var(--panel); border-radius: 12px; }
.u > button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 165px 120px 95px minmax(0, 1fr) 190px; gap: 16px; align-items: center; padding: 14px 18px; cursor: pointer; border-radius: 12px; }
.u > button:focus-visible { outline: 3px solid var(--sun); }
.u.soon > button { box-shadow: inset 4px 0 0 var(--sun); }
.u .cd { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--sun); line-height: 1.05; }
.u .cd.dayonly { color: var(--text); }
.u .when { font-size: 13px; color: var(--muted); }
.u .tok { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1; }
.u .nm { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u .val { font-family: var(--display); font-weight: 800; font-size: 22px; }
.u .val.na { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--muted); }
.u .track { height: 9px; }
.u .pct { font-size: 13px; color: var(--muted); margin-top: 4px; }
.u .pct b { color: var(--text); }
.c-score { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pchip, .cchip { font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
.pchip.p-low { color: var(--bull); background: rgba(67, 214, 160, .13); }
.pchip.p-mod { color: var(--sun); background: rgba(255, 181, 71, .13); }
.pchip.p-high { color: var(--bear); background: rgba(255, 107, 125, .14); }
.pchip.p-vhigh { color: #1A1406; background: var(--bear); }
.pchip.p-na { color: var(--muted); background: rgba(255, 255, 255, .06); }
.cchip { color: var(--muted); background: rgba(255, 255, 255, .05); font-weight: 500; }
.cchip b { color: var(--text); font-variant-numeric: tabular-nums; }
.cchip.c-high b { color: var(--bull); } .cchip.c-good b { color: var(--calm); } .cchip.c-low b { color: var(--sun); } .cchip.c-unverified b { color: var(--bear); }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 8px; }
.mgrid h4 { margin: 0 0 4px; font-size: 15px; color: var(--text); }
.small { font-size: 13.5px; color: var(--muted); margin: 0 0 6px; }
ul.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.facts li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.4; }
ul.facts b { color: var(--text); font-weight: 600; }
.fp { font-weight: 700; text-align: right; }
.fp.neg { color: var(--bear); } .fp.pos { color: var(--bull); } .fp.na { color: var(--muted); font-weight: 500; }
.ev { color: var(--muted); font-size: 13px; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px 12px; }
details.method { background: var(--panel); border-radius: 12px; padding: 12px 16px; margin: 0 0 14px; }
details.method summary { cursor: pointer; color: var(--sun); font-weight: 600; }
.mbody { display: grid; gap: 10px; margin-top: 10px; max-width: 75ch; }
.mbody p { margin: 0; }
.evlist { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
@media (max-width: 720px) { .mgrid { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border-radius: 14px; padding: 18px 20px; margin: 0 0 16px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; margin: 0; }
.phead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.phead .seg { margin: 0; }
.chartbox { position: relative; overflow-x: auto; }
.tip[hidden] { display: none; }
.lc { width: 100%; min-width: 600px; height: auto; display: block; }
.lc .grid { stroke: rgba(255,255,255,.07); stroke-width: 1; }
.lc .zero { stroke: rgba(255,255,255,.28); stroke-width: 1; }
.lc .d0, .spark .d0 { stroke: var(--sun); stroke-width: 1; stroke-dasharray: 3 3; }
.lc .xh { stroke: rgba(255,255,255,.4); stroke-width: 1; }
.lc .tick { fill: var(--muted); font-size: 12px; font-family: var(--body); }
.lc .dl { fill: var(--text); font-size: 12.5px; font-family: var(--body); font-weight: 600; }
.tip { position: absolute; top: 8px; background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: grid; gap: 3px; min-width: 170px; pointer-events: none; }
.tip i, .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.spark svg polyline { stroke: var(--text); }
.spark .zero { stroke: rgba(255,255,255,.2); }
table.gt td:first-child { white-space: nowrap; }
.smalltag { color: var(--sun); font-size: 12px; font-weight: 600; }
.rng { display: block; color: var(--muted); font-size: 11.5px; }
.verdict { margin: 0; font-weight: 600; max-width: 75ch; }
tr.small td { opacity: .75; }
.na { color: var(--muted); }
.bars2 { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 46px; gap: 12px; align-items: center; font-size: 14px; }
.bar2 { height: 12px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--sun); border-radius: 0 4px 4px 0; }
table.el { min-width: 680px; }
table.el tr.click { cursor: pointer; }
table.el tr.click:hover td, table.el tr.open td { background: var(--panel-2); }
table.el tr.click:focus-visible { outline: 2px solid var(--sun); outline-offset: -2px; }
table.el small { color: var(--muted); }
table.el tr.det td { background: var(--panel-2); }
section > .tablewrap, .panel .tablewrap { background: transparent; }
@media (max-width: 560px) { .brow { grid-template-columns: 110px minmax(0, 1fr) 40px; } .panel { padding: 14px; } }

.u .more { padding: 0 18px 16px; font-size: 14.5px; color: var(--muted); display: grid; gap: 4px; }
.u .more b { color: var(--text); font-weight: 600; }
@media (max-width: 560px) { .prices { gap: 4px 14px; } .prices .p { font-size: 21px; } }
@media (max-width: 720px) {
  .u > button { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
  .u .c-tok { grid-row: 1; grid-column: 1; }
  .u .c-val { grid-row: 1; grid-column: 2; text-align: right; }
  .u .c-cd { grid-row: 2; grid-column: 1; }
  .c-score { grid-row: 4; grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; flex-wrap: wrap; }
  .u .c-sup { grid-row: 3; grid-column: 1 / -1; }
}

.sched { display: grid; gap: 8px; }
.sched .s { background: var(--panel); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px; gap: 16px; align-items: baseline; }
.sched .tok { font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1; }
.sched .nm, .sched .k { font-size: 13px; color: var(--muted); }
.sched .amt { font-weight: 600; }
.sched .note { font-size: 14px; color: var(--muted); margin-top: 2px; }
.sched .nx { text-align: right; font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--sun); }
@media (max-width: 640px) { .sched .s { grid-template-columns: 1fr auto; } .sched .s > div:nth-child(2) { grid-column: 1 / -1; grid-row: 2; } }

.cal { display: grid; gap: 6px; }
.crow { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; padding: 12px 16px; border-radius: 12px; }
.crow.key { background: var(--panel); box-shadow: inset 4px 0 0 var(--sun); }
.crow .t { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.crow .t small { display: block; font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--muted); }
.crow .e { font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.crow .e .mood { font-size: 0; flex: none; }
.crow .e .mood::before { width: 10px; height: 10px; }
.crow .n { font-size: 14.5px; color: var(--muted); padding-left: 20px; }
@media (max-width: 560px) { .crow { grid-template-columns: 1fr; gap: 4px; } }

.tablewrap { overflow-x: auto; background: var(--panel); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--sun); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.tk { font-family: var(--display); font-weight: 900; font-size: 19px; }
td.tk small { display: block; font-family: var(--body); font-weight: 500; font-size: 12.5px; color: var(--muted); }
tr:last-child td { border-bottom: 0; }

footer { margin-top: 48px; padding-top: 18px; border-top: 2px solid var(--line); font-size: 13.5px; color: var(--muted); display: grid; gap: 6px; }
.state { padding: 60px 0; color: var(--muted); }
.fresh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin: 0 0 18px; }
.fresh b { color: var(--text); font-weight: 600; }
.fresh.stale { color: var(--sun); background: rgba(255, 181, 71, .1); border-radius: 10px; padding: 10px 14px; }
.fresh.stale b { color: var(--sun); }
.breaking { display: grid; gap: 10px; margin: 0 0 22px; }
.breaking a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; text-decoration: none; color: inherit; background: var(--panel-2); border-radius: 12px; padding: 14px 18px; box-shadow: inset 4px 0 0 var(--bear); }
.breaking .tag { color: var(--bear); font-weight: 700; font-size: 13px; padding-top: 2px; }
.breaking b { font-size: 17px; }
.breaking span.s { grid-column: 2; color: var(--muted); font-size: 15px; }
html.scene-mode, html.scene-mode body { height: 100%; overflow: hidden; background: var(--night); }
.scene-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div class="brand"><h1 id="brand">Crypto Desk</h1><p id="tagline"></p></div>
      <div class="prices" id="prices" aria-live="polite"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="news" aria-selected="true">Today</button>
      <button role="tab" data-tab="unlocks" aria-selected="false">Token unlocks</button>
      <button role="tab" data-tab="past" aria-selected="false">Past unlocks</button>
      <button role="tab" data-tab="week" aria-selected="false">Week ahead</button>
      <button role="tab" data-tab="supply" aria-selected="false">Supply and revenue</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="state">Loading today’s desk…</p></main>
<div class="wrap"><footer id="foot"></footer></div>

<script src="assets/desk.js"></script>
<script>
(function () {
  function sceneRoute() {
    const m = location.hash.match(/^#obs(?:-(unlocks|story|calendar|ticker))?$/);
    if (!m) return false;
    const f = document.createElement('iframe');
    f.src = 'obs.html' + (m[1] ? '?scene=' + m[1] : '');
    f.title = m[1] ? 'Stream scene: ' + m[1] : 'Stream scenes';
    f.className = 'scene-frame';
    document.documentElement.classList.add('scene-mode');
    document.body.replaceChildren(f);
    return true;
  }
  addEventListener('hashchange', () => { if (/^#obs/.test(location.hash) || document.documentElement.classList.contains('scene-mode')) location.reload(); });
  if (sceneRoute()) return;
  const { el } = Desk;
  const main = document.getElementById('main');
  let D, P, tab = 'news', uRange = 30, uView = 'upcoming', sortKey = 'revenueUsdM', open = null, cdTimer;
  try { const h = location.hash.slice(1); if (['news', 'unlocks', 'past', 'week', 'supply'].includes(h)) tab = h; } catch (e) {}

  function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

  function renderPrices() {
    const box = document.getElementById('prices');
    const kids = ['btc', 'eth', 'sol'].map(k => {
      const x = P && P[k], ch = Desk.change(x && x.chg24h);
      return el('div', null, [el('span', { class: 's', text: k.toUpperCase() }), el('span', { class: 'p num', text: Desk.price(x && x.price) }), el('span', { class: 'ch num ' + ch.dir, text: ch.text })]);
    });
    kids.push(el('span', { class: 'src', text: P && P.live ? 'Live from ' + P.source + ', updates every minute' : 'Prices as of ' + (P && P.source || 'the brief') }));
    box.replaceChildren(...kids);
  }

  function freshness() {
    const v = D.news.verification;
    const h = Desk.ageHours(D.news.updated);
    const stale = h == null || h > 8 || !v;
    const when = new Date(D.news.updated).toLocaleString('en-US', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: D.site.timeZone }) + ' ' + (D.site.tzLabel || '');
    const kids = [el('span', null, [el('b', { text: 'Updated ' + Desk.ago(D.news.updated) }), ' (' + when + ')'])];
    if (v) kids.push(el('span', { text: 'Checked against sources ' + Desk.ago(v.checkedAt) + ': ' + v.claimsChecked + ' facts confirmed' + (v.claimsRemoved ? ', ' + v.claimsRemoved + ' removed as unconfirmed' : '') + '.' }));
    else kids.push(el('span', { text: 'This edition has not been through the source check yet.' }));
    if (h != null && h > 8) kids.unshift(el('b', { text: 'News is more than 8 hours old. Prices at the top are still live; the stories, odds and calendar may be out of date.' }));
    return el('p', { class: 'fresh' + (stale ? ' stale' : ''), role: stale ? 'status' : null }, kids);
  }

  function breaking() {
    const b = (D.news.breaking || []).filter(x => (Desk.ageHours(x.at) ?? 99) < 24);
    if (!b.length) return null;
    return el('div', { class: 'breaking', 'aria-label': 'Breaking' }, b.map(x => el('a', { href: x.url, target: '_blank', rel: 'noopener' }, [
      el('span', { class: 'tag', text: 'Breaking, ' + Desk.ago(x.at) }), el('b', { text: x.title }), el('span', { class: 's', text: x.summary || '' })
    ])));
  }

  function news() {
    const n = D.news;
    return el('section', { 'aria-label': 'Today' }, [
      breaking(),
      el('p', { class: 'lead', text: n.headline }),
      freshness(),
      el('div', { class: 'stories' }, (n.stories || []).map(s => el('article', { class: 'storyc' }, [
        el('span', { class: 'mood ' + s.mood, text: cap(s.mood) }),
        el('h3', { text: s.title }),
        el('p', { text: s.summary }),
        el('details', null, [
          el('summary', { text: 'The details and sources' }),
          el('ul', null, (s.points || []).map(p => el('li', { text: p }))),
          el('div', { class: 'srcs' }, (s.sources || []).map(x => el('a', { href: x.url, target: '_blank', rel: 'noopener', text: x.label })))
        ])
      ]))),
      (n.briefs || []).length ? el('h2', { text: 'Also today' }) : null,
      el('div', { class: 'briefs' }, (n.briefs || []).map(b => el('a', { href: b.url, target: '_blank', rel: 'noopener' }, [el('b', { text: b.title }), el('span', { text: b.summary })])))
    ]);
  }

  const PRESSURE = { 'Low': 'p-low', 'Moderate': 'p-mod', 'High': 'p-high', 'Very high': 'p-vhigh', 'Not enough data': 'p-na' };
  function pressureChip(u) {
    const g = (u.impact && u.impact.grade) || 'Not enough data';
    return el('span', { class: 'pchip ' + PRESSURE[g], title: 'Sell pressure, based on what past unlocks like this did' }, [g === 'Not enough data' ? 'Pressure: not enough data' : 'Sell pressure: ' + g]);
  }
  function confChip(u) {
    const c = u.confidenceScore ?? 0, l = u.confidenceLabel || 'Unverified';
    return el('span', { class: 'cchip c-' + l.toLowerCase(), title: 'How sure we are the date and size are right' }, [el('b', { text: String(c) }), ' ' + l.toLowerCase()]);
  }
  function evidenceLink(key) {
    const e = ((D.unlocks.scoring || {}).evidence || {})[key];
    if (!e) return null;
    return e.url ? el('a', { href: e.url, target: '_blank', rel: 'noopener', text: e.label }) : el('span', { text: e.label });
  }
  function fmtPts(p) { return p == null ? '?' : (p > 0 ? '+' : '') + p; }

  function unlockRow(u, now) {
    const c = Desk.countdown(u, now), v = Desk.usd(u.usdM), id = u.date + u.token;
    const isOpen = open === id;
    const btn = el('button', { type: 'button', 'aria-expanded': String(isOpen) }, [
      el('div', { class: 'c-cd' }, [el('div', { class: 'cd num' + (u.timeUTC ? '' : ' dayonly'), 'data-cd': id, text: c.text }), el('div', { class: 'when', text: Desk.dayLabel(u, D.site.timeZone) + (u.timeUTC ? ' ' + (D.site.tzLabel || '') : '') })]),
      el('div', { class: 'c-tok' }, [el('div', { class: 'tok', text: u.token }), el('div', { class: 'nm', text: u.name })]),
      el('div', { class: 'c-val' }, [v ? el('div', { class: 'val num', text: v }) : el('div', { class: 'val na', text: 'Size unconfirmed' })]),

  function lineChart(seriesList) {
    const W = 800, H = 330, L = 48, R = 112, T = 16, B = 34;
    const xs = d => L + (d + 30) / 44 * (W - L - R);
    let lo = 0, hi = 0;
    seriesList.forEach(s => Object.values(s.path).forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
    const step = (hi - lo) > 30 ? 10 : 5;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    if (hi === lo) hi = lo + step;
    const ys = v => T + (hi - v) / (hi - lo) * (H - T - B);
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Median price against Bitcoin, 30 days before to 14 days after unlocks" class="lc">';
    for (let v = lo; v <= hi; v += step) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(v) + '" y2="' + ys(v) + '" class="' + (v === 0 ? 'zero' : 'grid') + '"/>';
      svg += '<text x="' + (L - 8) + '" y="' + (ys(v) + 4) + '" class="tick" text-anchor="end">' + (v > 0 ? '+' : '') + v + '%</text>';
    }
    [-30, -21, -14, -7, 0, 7, 14].forEach(d => {
      svg += '<text x="' + xs(d) + '" y="' + (H - 10) + '" class="tick" text-anchor="middle">' + (d === 0 ? 'Unlock' : (d > 0 ? '+' : '') + d + 'd') + '</text>';
    });
    svg += '<line x1="' + xs(0) + '" x2="' + xs(0) + '" y1="' + T + '" y2="' + (H - B) + '" class="d0"/>';
    const labels = [];
    seriesList.forEach(s => {
      const pts = Object.keys(s.path).map(Number).sort((a, b) => a - b).map(d => xs(d).toFixed(1) + ',' + ys(s.path[d]).toFixed(1));
      if (!pts.length) return;
      svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      const lastD = Math.max(...Object.keys(s.path).map(Number));
      labels.push({ y: ys(s.path[lastD]), text: s.label + ' ' + (s.path[lastD] > 0 ? '+' : '') + s.path[lastD].toFixed(1) + '%', color: s.color });
    });
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 15) labels[i].y = labels[i - 1].y + 15;
    labels.forEach(l => {
      svg += '<circle cx="' + (W - R + 8) + '" cy="' + (l.y - 4) + '" r="4" fill="' + l.color + '"/>';
      svg += '<text x="' + (W - R + 16) + '" y="' + l.y + '" class="dl">' + l.text + '</text>';
    });
    svg += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" visibility="hidden"/>';
    svg += '<rect class="hit" x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - B) + '" fill="transparent"/>';
    svg += '</svg>';
    const box = el('div', { class: 'chartbox' });
    box.innerHTML = svg;
    const tip = el('div', { class: 'tip', hidden: true });
    box.appendChild(tip);
    const s = box.querySelector('svg'), xh = box.querySelector('.xh'), hit = box.querySelector('.hit');
    function move(ev) {
      const r = s.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * W;
      const d = Math.max(-30, Math.min(14, Math.round((x - L) / (W - L - R) * 44 - 30)));
      xh.setAttribute('x1', xs(d)); xh.setAttribute('x2', xs(d)); xh.setAttribute('visibility', 'visible');
      const rows = seriesList.filter(q => q.path[d] != null).sort((a, b) => b.path[d] - a.path[d]);
      tip.replaceChildren(el('b', { text: d === 0 ? 'Unlock day' : (d < 0 ? Math.abs(d) + ' days before' : d + ' days after') }),
        ...rows.map(q => el('div', null, [el('i', { style: 'background:' + q.color }), q.label + ' ', pct(q.path[d])])));
      tip.hidden = false;
      const px = xs(d) / W * r.width;
      tip.style.left = Math.min(px + 12, r.width - 190) + 'px';
    }
    hit.addEventListener('mousemove', move);
    hit.addEventListener('mouseleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
    return box;
  }

      seg([['who', 'Who receives'], ['size', 'Size vs supply'], ['vol', 'Size vs trading'], ['kind', 'First insider unlock']], pastBreak, v => pastBreak = v),
      groupTable(brRows),
      el('p', { class: 'small', text: '* Share that did worse than Bitcoin from 7 days before to 14 days after. ** The same three weeks compared with the token’s own average three-week trend against Bitcoin over the year; the small figures are the 90% range for that median, and a range that crosses 0 means the group’s effect is not clear. Ranges resample whole tokens, because one token’s monthly unlocks move together. Medians are the middle unlock in each group, so one extreme token cannot drag the number.' })]);

    // timing
    const tot = Object.values(lc).reduce((a, b) => a + b, 0) || 1;
    const timing = el('div', { class: 'panel' }, [el('h3', { text: 'When the lowest point came' }),
      el('div', { class: 'bars2' }, Object.keys(lc).map(k => el('div', { class: 'brow' }, [el('span', { text: k }),
        el('div', { class: 'bar2' }, [el('i', { style: 'width:' + (100 * lc[k] / tot) + '%' })]), el('span', { class: 'num', text: Math.round(100 * lc[k] / tot) + '%' })]))),
      el('p', { class: 'small', text: 'For each unlock, the day its price was lowest against Bitcoin between 30 days before and 14 days after.' })]);

    // list
    const evs = bt.events.filter(e => pastFilter === 'all' || e.grade === pastFilter);
    const list = el('div', { class: 'panel' }, [el('h3', { text: 'Every past unlock (' + bt.events.length + ')' }),
      seg([['all', 'All']].concat(GRADE_ORDER.filter(g => G['Grade: ' + g]).map(g => [g, g])), pastFilter, v => pastFilter = v),
      el('div', { class: 'tablewrap' }, [el('table', { class: 'el' }, [
        el('thead', null, [el('tr', null, [el('th', { text: 'Date' }), el('th', { text: 'Token' }), el('th', { text: 'Our grade' }), el('th', { class: 'n', text: '7d before' }), el('th', { class: 'n', text: '7d after' }), el('th', { class: 'n', text: '14d after' }), el('th', { text: 'Path vs BTC' })])]),
        el('tbody', null, evs.flatMap(e => {
          const id = e.token + e.date, open = pastOpen === id;
          const tr = el('tr', { class: 'click' + (open ? ' open' : ''), tabindex: '0', 'aria-expanded': String(open) }, [
            el('td', { class: 'num', text: e.date }), el('td', null, [el('b', { text: e.token }), el('small', { text: e.usdM ? ' ' + Desk.usd(e.usdM) : '' })]),
            el('td', null, [el('span', { class: 'pchip ' + (PRESSURE[e.grade] || 'p-na'), text: e.grade })]),
            el('td', { class: 'n' }, [pct(e.moves.pre7)]), el('td', { class: 'n' }, [pct(e.moves.post7)]), el('td', { class: 'n' }, [pct(e.moves.post14)]),
            el('td', null, [spark(e.path)])]);
          const toggle = () => { pastOpen = open ? null : id; render(); };
          tr.addEventListener('click', toggle);
          tr.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
          if (!open) return [tr];
          const mix = e.recipientsMix ? Object.entries(e.recipientsMix).filter(([, v]) => v >= 0.05).map(([k, v]) => k + ' ' + Math.round(v * 100) + '%').join(', ') : 'not confirmed';
          const det = el('tr', { class: 'det' }, [el('td', { colspan: '7' }, [el('div', { class: 'more' }, [
            el('div', null, [el('b', { text: 'Size: ' }), (e.amountTokens ? Number(e.amountTokens).toLocaleString('en-US') + ' tokens' : 'unconfirmed') + (e.pctCirculating != null ? ', ' + e.pctCirculating + '% of circulating' : '') + (e.advDays != null ? ', ' + e.advDays + ' days of trading' : '')]),
            el('div', null, [el('b', { text: 'Who received it: ' }), mix + (e.firstInsiderUnlock ? '. First insider unlock.' : '')]),
            el('div', null, [el('b', { text: '30 days before: ' }), pct(e.moves.pre30), '. ', el('b', { text: 'Whole window (7 before to 14 after): ' }), pct(e.moves.around), e.moves.beyondNormal != null ? ' (' : '', e.moves.beyondNormal != null ? pct(e.moves.beyondNormal) : '', e.moves.beyondNormal != null ? ' beyond its normal trend of ' : '', e.moves.normal21 != null ? pct(e.moves.normal21) : '', e.moves.beyondNormal != null ? ' per three weeks)' : '', '. ', el('b', { text: 'Biggest one-day drop: ' }), e.worstDay != null ? (e.worstDay === 0 ? 'unlock day' : (e.worstDay < 0 ? Math.abs(e.worstDay) + ' days before' : e.worstDay + ' days after')) + ' (' : '', e.worstDay != null ? pct(e.worstDayMove) : '', e.worstDay != null ? ')' : '']),
            e.predicted && e.predicted.grade ? el('div', null, [el('b', { text: 'Live page said beforehand: ' }), e.predicted.grade + ' (confidence ' + e.predicted.confidence + ')']) : null,
            e.check ? el('div', null, [el('b', { text: 'Independent check: ' }), e.check + (e.checkNotes ? '. ' + e.checkNotes : '')]) : null,
            el('ul', { class: 'facts' }, e.factors.map(f => el('li', null, [el('span', { class: 'fp num' + (f.points == null ? ' na' : f.points > 0 ? ' neg' : f.points < 0 ? ' pos' : ''), text: fmtPts(f.points) }), el('span', null, [el('b', { text: f.label }), ' ' + f.detail])]))),
            el('div', { class: 'srcs' }, [el('b', { text: 'Sources: ' })].concat((e.sources || []).map(s => el('a', { href: s.url, target: '_blank', rel: 'noopener', text: s.label || 'Source' }))))
          ])])]);
          return [tr, det];
        }))
      ])])]);

    return el('section', { 'aria-label': 'Past unlocks' }, [lead, sub, chart, gradeBlock, breakBlock, timing, list,
      el('details', { class: 'method' }, [el('summary', { text: 'How this is measured' }), el('div', { class: 'mbody' }, [el('p', { text: bt.method }),
        el('p', { text: 'This is a record of what happened, not a prediction. Small groups are noisy, overlapping monthly tranches are not independent, and a year of data covers one market regime.' }),
        (bt.skipped && bt.skipped.length) ? el('p', { class: 'small', text: 'Left out: ' + bt.skipped.map(s => s.token + (s.date ? ' ' + s.date : '') + ' (' + s.why + ')').join('; ') }) : null])])]);
  }

  function render() {
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    const view = { news, unlocks, past, week, supply }[tab]();
    main.replaceChildren(view);
    clearInterval(cdTimer);
    if (tab === 'unlocks' && uView === 'upcoming') {
      cdTimer = setInterval(() => {
        const now = new Date();
        D.unlocks.upcoming.forEach(u => { const n = main.querySelector('[data-cd="' + CSS.escape(u.date + u.token) + '"]'); if (n) n.textContent = Desk.countdown(u, now).text; });
      }, 1000);
    }
  }

  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} render();
  }));

  async function boot() {
    try { D = await Desk.load(''); }
    catch (e) { main.replaceChildren(el('p', { class: 'state', text: 'Couldn’t read the data files (' + e.message + '). Open this page through the website or the local server, not as a file.' })); return; }
    document.getElementById('brand').textContent = D.site.brand || 'Crypto Desk';
    document.getElementById('tagline').textContent = D.site.tagline || '';
    document.title = (D.site.brand || 'Crypto') + ' Desk';
    document.getElementById('foot').replaceChildren(
      el('div', { text: D.site.disclaimer || '' }),
      el('div', { text: 'News updated ' + Desk.ago(D.news.updated) + '. Unlock data checked ' + Desk.ago(D.unlocks.checkedAt || D.unlocks.updated) + '. ' + (D.unlocks.snapshot || '') }),
      el('div', null, ['Unlock dates and sizes often change and sources disagree; the confidence tag on each row says how solid it is. ', el('a', { href: '#obs', text: 'Stream scenes' })])
    );
    try { D.backtest = await fetch('data/backtest.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null); } catch (e) { D.backtest = null; }
    P = await Desk.prices(D.news.market);
    renderPrices();
    render();
    setInterval(async () => { P = await Desk.prices(D.news.market); renderPrices(); }, 60000);
    setInterval(async () => { try { const bt = D.backtest; D = await Desk.load(''); D.backtest = bt; render(); } catch (e) {} }, 300000);
  }
  boot();
})();
</script>
</body>
</html>
